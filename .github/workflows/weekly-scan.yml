name: Stock Scout Weekly Scan

on:
  # Sunday 05:00 UTC = 08:00 IDT (Israel summer time)
  # Total scan time: ~30-45 min (Reddit is slow). Email arrives by ~08:45.
  # 60+ minute buffer before 10:00 deadline for safety.
  # Workflow timeout: 90 min (safety buffer)
  schedule:
    - cron: '0 5 * * 0'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests supabase yfinance pandas

      - name: Run Stock Scanner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          BOSS_EMAIL: ${{ secrets.BOSS_EMAIL }}
          MIN_MARKET_CAP: ${{ secrets.MIN_MARKET_CAP }}
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scanner.py
